name: Publish private application release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.5.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag and application version
        id: version
        shell: bash
        run: |
          set -Eeuo pipefail
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$package_version" != "$tag_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $package_version" >&2
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "version=$package_version" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Test and build application
        run: |
          pnpm test
          pnpm typecheck
          pnpm lint
          pnpm build

      - name: Log in to private GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push immutable image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.version.outputs.image }}:${{ github.ref_name }}
            ${{ steps.version.outputs.image }}:latest
          build-args: |
            RICKY_APP_VERSION=${{ steps.version.outputs.version }}
            RICKY_BUILD_COMMIT=${{ github.sha }}

      - name: Build signed-by-CI update manifest
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          jq -n \
            --arg version "$VERSION" \
            --arg tag "$GITHUB_REF_NAME" \
            --arg image "$IMAGE@$DIGEST" \
            --arg published "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schemaVersion:1,version:$version,releaseTag:$tag,image:$image,publishedAt:$published,minimumDataSchemaVersion:1,maximumDataSchemaVersion:1,requiredUpdaterVersion:"1.0.0",notes:["管理端集中展示版本与更新状态","支持一键更新、重启和失败自动回滚","升级保留知识库、前台内容、Agent、模型配置与运行记录"]}' \
            > update-manifest.json

      - name: Create private GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" update-manifest.json \
            --repo "$GITHUB_REPOSITORY" \
            --title "Ricky Twin $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
