services:
  ricky-twin:
    image: ${RICKY_TWIN_IMAGE:?RICKY_TWIN_IMAGE is required}
    container_name: ricky-twin
    restart: unless-stopped
    env_file:
      - ../config/.env
    environment:
      RICKY_APP_VERSION: ${RICKY_APP_VERSION:?RICKY_APP_VERSION is required}
      RICKY_CONTENT_DATA_DIR: /app/data
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:${RICKY_TWIN_HOST_PORT:?RICKY_TWIN_HOST_PORT is required}:3000"
    volumes:
      - ../data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=128m,uid=1001,gid=1001,mode=0750
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
